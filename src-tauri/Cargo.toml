[package]
name = "chatgpt-installer"
version = "1.2.0"
edition = "2021"
rust-version = "1.77"
description = "ChatGPT Windows 桌面版一键安装助手（开源、纯客户端）"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 原生文件夹选择器（更改下载目录）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# blocking 模式：下载逻辑写在独立线程里，保持简单
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
# 解析 MSIX（本质是 zip）内的 AppxManifest.xml，核验包身份
zip = "2"
quick-xml = "0.37"

[target.'cfg(windows)'.dependencies]
# 读系统版本号（CurrentBuildNumber）
winreg = "0.55"
# 单实例：防止双开同时写同一个下载分片
tauri-plugin-single-instance = "2"
# 原生 Win32 API：管理员检测 / 原生架构 / 磁盘空间，替代 PowerShell 冷启动（每次 0.5~2s）
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
