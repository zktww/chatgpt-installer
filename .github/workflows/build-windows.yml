name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        run: |
          $tauri = Join-Path $env:USERPROFILE ".cargo\bin\tauri.exe"
          if (-not (Test-Path $tauri)) { Get-ChildItem "$env:USERPROFILE\.cargo\bin"; throw "tauri.exe not found at $tauri" }
          & $tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-installer-windows
          path: |
            src-tauri/target/release/chatgpt-installer.exe
            src-tauri/target/release/bundle/nsis/
