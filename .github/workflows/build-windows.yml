name: Build Windows

# - check：推送到 main / PR 时做静态检查与单元测试（windows-latest，几分钟内完成）
# - build：只在打 tag（如 v1.2.0）或手动触发时构建安装包；打 tag 自动创建 Release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test

  build-windows:
    needs: check
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # tag 必须与配置里的版本号一致，避免产物文件名 / 文件属性版本对不上
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag -ne $conf -or $tag -ne $cargo) {
            Write-Error "版本不一致：tag=$tag tauri.conf.json=$conf Cargo.toml=$cargo"
            exit 1
          }

      # 用 npm 上的预编译 CLI，省掉每次 cargo install tauri-cli 的数分钟源码编译
      - name: Build Tauri app
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Upload build artifacts
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-installer-windows
          path: |
            src-tauri/target/release/chatgpt-installer.exe
            src-tauri/target/release/bundle/nsis/*.exe

      # 检测是否已配置 SignPath 密钥与组织 ID（审核通过并在仓库配置 Secret/Variable 后自动生效）
      - name: Check SignPath configuration
        id: signpath-cfg
        shell: pwsh
        env:
          SP_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SP_ORG: ${{ vars.SIGNPATH_ORG_ID }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SP_TOKEN) -and -not [string]::IsNullOrWhiteSpace($env:SP_ORG)) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Submit signing request to SignPath
        if: steps.signpath-cfg.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'chatgpt-installer' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-artifacts

      - name: Replace binaries with signed artifacts
        if: steps.signpath-cfg.outputs.enabled == 'true'
        shell: pwsh
        run: |
          if (Test-Path "signed-artifacts/src-tauri/target/release/chatgpt-installer.exe") {
            Copy-Item "signed-artifacts/src-tauri/target/release/chatgpt-installer.exe" "src-tauri/target/release/chatgpt-installer.exe" -Force
          } elseif (Test-Path "signed-artifacts/chatgpt-installer.exe") {
            Copy-Item "signed-artifacts/chatgpt-installer.exe" "src-tauri/target/release/chatgpt-installer.exe" -Force
          }
          Get-ChildItem -Path "signed-artifacts" -Filter "*-setup.exe" -Recurse | ForEach-Object {
            Copy-Item $_.FullName "src-tauri/target/release/bundle/nsis/$($_.Name)" -Force
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/chatgpt-installer.exe
            src-tauri/target/release/bundle/nsis/*.exe
